name: Проверки
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: labeldesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U demo -d labeldesk"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://demo:demo@localhost:5432/labeldesk
      API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts && npm run build
        working-directory: frontend
      - run: git diff --exit-code -- labeldesk/static
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
